[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gymlx"
version = "0.1.0"
description = "Hardware-accelerated gymnasium environments using MLX"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
